version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sehat-awaaz-db
    environment:
      POSTGRES_DB: sehat_awaaz
      POSTGRES_USER: sehat_admin
      POSTGRES_PASSWORD: sehat_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d/01-migrations
      - ./backend/src/db/seeds:/docker-entrypoint-initdb.d/02-seeds
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sehat_admin -d sehat_awaaz']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
